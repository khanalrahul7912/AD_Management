{% extends "base.html" %}

{% block title %}Reset Password - AD Management{% endblock %}
{% block page_title %}Reset Password: {{ username }}{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('users.view_user', username=username) }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Back to User
    </a>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="password" class="form-label">New Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password" required>
                        <div class="form-text">Must meet domain password complexity requirements.</div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('users.view_user', username=username) }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-key"></i> Reset Password
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
