{% extends "base.html" %}

{% block title %}Edit Group - AD Management{% endblock %}
{% block page_title %}Edit Group: {{ group.name }}{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('groups.view_group', group_name=group.name) }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Back to Group
    </a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ group.description }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ group.email }}">
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('groups.view_group', group_name=group.name) }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
