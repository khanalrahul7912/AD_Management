{% extends "base.html" %}

{% block title %}Create Group - AD Management{% endblock %}
{% block page_title %}Create New Group{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('groups.list_groups') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Back to Groups
    </a>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="group_name" class="form-label">Group Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="group_name" name="group_name" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="group_type" class="form-label">Group Type</label>
                        <select class="form-select" id="group_type" name="group_type">
                            <option value="security" selected>Security</option>
                            <option value="distribution">Distribution</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="scope" class="form-label">Group Scope</label>
                        <select class="form-select" id="scope" name="scope">
                            <option value="global" selected>Global</option>
                            <option value="domain_local">Domain Local</option>
                            <option value="universal">Universal</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email (for distribution groups)</label>
                        <input type="email" class="form-control" id="email" name="email">
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('groups.list_groups') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Create Group
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
